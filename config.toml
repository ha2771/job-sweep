# job-sweep configuration. Board names come from claude/job-search-criteria.md (2026-10-07).
# Nothing personal belongs in this file: no profile, no applied-to list.

[run]
window_hours = 72            # keep 72 so weekend runs can still show Friday postings
user_agent = "job-sweep/0.1 (personal new-grad job search)"
max_workers = 16
per_host_concurrency = 6
timeout_seconds = 25
state_path = "out/state.json"
out_dir = "out"
prune_days = 45

[filters]
# Case-insensitive regexes, matched against the job title.
# 'staff' is excluded except in "Member of Technical Staff"; 'conversion' drops intern-conversion-only postings.
title_exclude = '\b(senior|sr|(?<!technical )staff|principal|lead|leader|manager|mgr|director|head|vp|vice president|chief|president|iii|iv|v|vi|intern|internship|co-?op|apprentice|architect|postdoc|postdoctoral|post-doctoral|phd|clearance|ts/sci|secret|polygraph|distinguished|expert|professor|faculty|technician|recruiter|sales|account executive|counsel|attorney|paralegal|conversion)\b'
title_include = 'machine learning|\bml\b|\bai\b|artificial intelligence|applied scien|research (engineer|scientist)|computer vision|\bcv\b|perception|deep learning|\bllms?\b|large language|generative|\bgen ?ai\b|\bnlp\b|natural language|speech|audio|signal processing|\bdsp\b|wireless|\b[56]g\b|radar|lidar|sensor fusion|inference|on-device|\bedge (ai|ml)\b|robot learning|reinforcement learning|\brobotics\b|data scien|\bvision\b|multimodal|foundation model|\bagents?\b|\bagentic\b|mlops|autonomy|embodied'
# Generic early-career titles are kept too, but only if they also name an engineering/science role.
early_career = 'new grad|new college|\bncg\b|university grad|college grad|recent grad|early[- ]career|entry[- ]level|\bjunior\b|\bjr\b|\bassociate\b|\bgraduate\b|\bgrad\b|202[67] start|class of 202[67]|\bresidency\b|rotational'
role_noun = 'engineer|scientist|developer|researcher|\bswe\b|software|programmer|technical staff'

[discovery]
enabled = true            # read Greenhouse/Ashby/Lever/Workday boards out of Simplify's links
include_in_sweep = true   # also sweep those boards, not just list them
max_age_days = 120        # only boards with a Simplify listing updated this recently
sweep_workday = true
workday_pages = 2         # newest 40 postings per discovered Workday site

[simplify]
url = "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"

